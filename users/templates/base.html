<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Vita</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body {
        background-color: #f9f6f1;
        color: #2c3e50;
    }
    .navbar {
        background-color: #D2B48C; /* Светло коричневый цвет */
    }
    .navbar-brand, .nav-link {
        color: white !important;
    }
    .footer {
        background-color: #D2B48C; /* Светло коричневый цвет */
        color: white;
        padding: 10px 0;
    }
    .btn-custom {
        background-color: #ecf0f1; /* Можно оставить или заменить на светло-коричневый, например, #F5DEB3 */
        color: #D2B48C; /* Цвет текста, чтобы гармонировал с фоном */
        border: none;
    }
</style>

</head>
<body>
    {% block content %}

    <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="#">M-Vita</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Услуги</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Мои записи</a>
                </li>
            </ul>
            <button class="btn btn-custom ml-2" data-toggle="modal" data-target="#userMenu">Меню</button>
        </div>
    </nav>
    <div class="modal fade" id="userMenu" tabindex="1" role="dialog" aria-labelledby="userMenuLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="userMenuLabel">Пользовательское меню</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <a href="#" class="btn btn-block btn-custom">Вход</a>
                    <a href="#" class="btn btn-block btn-custom">Выход</a>
                    <a href="#" class="btn btn-block btn-custom">Регистрация</a>
                    <a href="#" class="btn btn-block btn-custom">Профиль</a>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container text-center">
            <a href="#" class="small">Контакты</a> |
            <a href="#" class="small">Услуги</a> |
            <a href="#" class="small">Врачи</a> |
            <a href="#" class="small">О нас</a> |
            <a href="#" class="small">Карта проезда</a> |
            <a href="#" class="small">Наш Телеграм</a> |
            <a href="#" class="small">Записаться на прием</a> |
            <a href="#" class="small">Часто задаваемые вопросы</a>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    {% endblock %}
</body>
</html>
