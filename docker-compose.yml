version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=mvita.settings  # замените, если нужно
      - DB_NAME=mvita-db
      - DB_USER=postgres
      - DB_PASSWORD=fv4202QAZ
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: mvita-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fv4202QAZ
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
