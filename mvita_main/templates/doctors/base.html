<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M-Vita - Медицинская диагностика</title>
    <!-- Подключение Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        /* Весь ваш CSS, который был в начале, до строки 102 */
        .custom-button {
            display: inline-block;
            padding: 8px 12px;
            background-color: transparent;
            color: black;
            font-weight: bold;
            font-size: 14px;
            border: none;
            text-decoration: none;
            cursor: pointer;
            margin-right: 10px;
        }
        .custom-button:hover {
            text-decoration: underline;
        }
        /* Эффект затухания для элементов списка услуг */
        #servicesList .list-group-item:nth-last-child(1) { opacity: 0.2; }
        #servicesList .list-group-item:nth-last-child(2) { opacity: 0.4; }
        #servicesList .list-group-item:nth-last-child(3) { opacity: 0.6; }
        #servicesList .list-group-item:nth-last-child(4) { opacity: 0.8; }
        /* Общие стили в медицинском стиле */
        body {
            background-color: #f5f0e6;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        /* Шапка */
        .navbar {
            background-color: #e6d3b3;
        }
        /* Подвал */
        footer {
            background-color: #e6d3b3;
            padding: 20px 0;
        }
        /* Цвет для кнопок и ссылок */
        .btn-custom {
            background-color: #d2b48c;
            color: #fff;
        }
        .btn-custom:hover {
            background-color: #c19a6b;
        }
        /* Выдвижное меню пользователя */
        .dropdown-menu {
            min-width: 150px;
        }
    </style>
</head>
<body>
<!-- Шапка сайта -->
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">M-Vita</a>
    <div class="d-flex align-items-center ms-auto">
      <a href="{% url 'mvita:services' %}" class="custom-button">Услуги</a>
      <a href="{% url 'mvita:services' %}" class="custom-button">Мои результаты</a>
      <a href="{% url 'mvita:services' %}" class="custom-button">Контакты</a>
      <div class="dropdown ms-3">
        <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
          Пользователь
        </button>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
          <li><a class="dropdown-item" href="#">Вход</a></li>
          <li><a class="dropdown-item" href="#">Регистрация</a></li>
          <li><a class="dropdown-item" href="#">Профиль</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="#">Выход</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<!-- Начало блока контента -->
{% block content %}
<!-- Здесь будет вставляться уникальный контент страниц -->
{% endblock %}

<!-- Весь остальной код, который идет после строки 216 -->
<!-- Например, подвал сайта -->
<footer class="text-center">
  <div class="container">
    <div class="row justify-content-center mb-3">
      <button class="btn btn-custom mx-2">О нас</button>
      <button class="btn btn-custom mx-2">Обратная связь</button>
      <button class="btn btn-custom mx-2">Наши врачи</button>
      <!-- добавьте другие кнопки по необходимости -->
    </div>
    <p class="mb-0">&copy; 2025 M-Vita. Все права защищены.</p>
  </div>
</footer>

<!-- Скрипты Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
